<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Windows и SoftSplit: дублирование и расширение мониторов</title>
  <desc id="desc">Сверху: Windows применяет дублирование ко всем дисплеям сразу и приводит их к одному разрешению. Снизу: SoftSplit дублирует дисплеи A и B, оставляя C и D расширенными, и каждый дисплей сохраняет своё разрешение.</desc>

  <defs>
    <g id="content-source">
      <rect x="0" y="0" width="154" height="89" fill="#0B1220"/>
      <rect x="0" y="0" width="154" height="12" fill="#1E293B"/>
      <rect x="8" y="20" width="60" height="44" fill="#2563EB" opacity="0.85"/>
      <rect x="74" y="20" width="72" height="20" fill="#334155"/>
      <rect x="74" y="46" width="72" height="18" fill="#334155"/>
      <rect x="0" y="80" width="154" height="9" fill="#111827"/>
    </g>
    <g id="content-extend-1">
      <rect x="0" y="0" width="154" height="89" fill="#0B1220"/>
      <rect x="0" y="0" width="154" height="12" fill="#1E293B"/>
      <rect x="8" y="20" width="138" height="52" fill="#0F766E" opacity="0.8"/>
      <rect x="0" y="80" width="154" height="9" fill="#111827"/>
    </g>
    <g id="content-extend-2">
      <rect x="0" y="0" width="154" height="89" fill="#0B1220"/>
      <rect x="0" y="0" width="154" height="12" fill="#1E293B"/>
      <rect x="8" y="20" width="64" height="52" fill="#7C3AED" opacity="0.8"/>
      <rect x="80" y="20" width="66" height="24" fill="#334155"/>
      <rect x="80" y="48" width="66" height="24" fill="#334155"/>
      <rect x="0" y="80" width="154" height="9" fill="#111827"/>
    </g>
    <g id="bezel">
      <rect x="0" y="0" width="170" height="105" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
      <rect x="8" y="8" width="154" height="89" rx="3" fill="#0B1220"/>
      <rect x="70" y="99" width="30" height="4" rx="2" fill="#94A3B8"/>
    </g>
  </defs>

  <rect x="0" y="0" width="900" height="430" fill="#FFFFFF"/>

  <!-- Section 1: Windows -->
  <g>
    <text x="40" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Windows: режим один на всю систему</text>
    <text x="40" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">При дублировании все дисплеи получают общий режим — самый низкий из поддерживаемых.</text>

    <g transform="translate(83,70)">
      <use href="#bezel"/>
      <g transform="translate(8,8)"><use href="#content-source"/></g>
    </g>
    <text x="168" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">1920×1080</text>

    <g transform="translate(271,70)">
      <use href="#bezel"/>
      <g transform="translate(8,8)"><use href="#content-source"/></g>
    </g>
    <text x="356" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">1920×1080</text>

    <g transform="translate(459,70)">
      <use href="#bezel"/>
      <g transform="translate(8,8)"><use href="#content-source"/></g>
    </g>
    <text x="544" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">1920×1080</text>

    <g transform="translate(647,70)">
      <use href="#bezel"/>
      <g transform="translate(8,8)"><use href="#content-source"/></g>
    </g>
    <text x="732" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">1920×1080</text>
  </g>

  <line x1="40" y1="218" x2="860" y2="218" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Section 2: SoftSplit -->
  <g>
    <text x="40" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F172A">SoftSplit: дублируется сколько нужно, остальное расширено</text>
    <text x="40" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">Каждый дисплей сохраняет своё разрешение, дублированные — тоже.</text>

    <g transform="translate(83,290)">
      <use href="#bezel"/>
      <g transform="translate(8,8)"><use href="#content-source"/></g>
    </g>
    <text x="168" y="412" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563EB">A — источник · 2560×1440</text>

    <g transform="translate(271,290)">
      <use href="#bezel"/>
      <g transform="translate(8,8)"><use href="#content-source"/></g>
    </g>
    <text x="356" y="412" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563EB">B — дубль A · 3840×2160</text>

    <g transform="translate(459,290)">
      <use href="#bezel"/>
      <g transform="translate(8,8)"><use href="#content-extend-1"/></g>
    </g>
    <text x="544" y="412" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">C — расширен · 1920×1080</text>

    <g transform="translate(647,290)">
      <use href="#bezel"/>
      <g transform="translate(8,8)"><use href="#content-extend-2"/></g>
    </g>
    <text x="732" y="412" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">D — расширен · 2560×1440</text>
  </g>
</svg>
